version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Next.js con SSR: las variables de la consola de Amplify solo existen durante el build.
            # Se copian a .env.production para que el servidor (proxy de Clerk, páginas) las lea en runtime.
            - env | grep -E '^(CLERK_SECRET_KEY|NEXT_PUBLIC_[A-Z_]+)=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
